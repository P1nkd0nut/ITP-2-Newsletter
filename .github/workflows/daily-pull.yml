name: Daily threat pull

# Pulls the latest feeds, triages them, checks every reference link for real,
# and commits the refreshed data back to the repository.
on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC every day
  workflow_dispatch:
    inputs:
      limit:
        description: "Max items to fetch per source"
        default: "20"

permissions:
  contents: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warn if OpenRouter key is missing
        if: env.OPENROUTER_API_KEY == ''
        run: echo "::warning::OPENROUTER_API_KEY secret is not set; triage will use the heuristic fallback instead of the LLM."

      - name: Ingest feeds
        run: python Backend/run_ingestion.py --poc --limit "${{ github.event.inputs.limit || '20' }}"

      - name: Triage and score
        run: python Backend/run_triage.py

      - name: Check reference links
        run: python Backend/run_link_check.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/data/staging/latest_envelopes.json \
                  Backend/data/staging/triaged_candidates.json \
                  Backend/data/staging/dead_links_report.json \
                  Backend/data/cache/link_health_cache.json \
                  Frontend/data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): daily threat pull $(date -u +%Y-%m-%d)"
            git push
          fi
