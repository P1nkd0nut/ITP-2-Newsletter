<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident · Grounded Threat News</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  <!-- Tailwind, prebuilt so the page works offline (rebuild: see HANDOVER.md) -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/dashboard/styles.css">
  <style>
    .section-title { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.5rem; }
    .prose-text { color: #cbd5e1; line-height: 1.7; white-space: pre-line; overflow-wrap: anywhere; }
    a.link { color: #22d3ee; overflow-wrap: anywhere; }
    a.link:hover { text-decoration: underline; }
  </style>
</head>
<!--
  Reader view of one incident, linked from the Telegram digest.
  Shows only what a reader needs (CVE, problem, impact, PoC, fix, sources);
  the scoring and debugging details stay on the team dashboard.
-->
<body class="bg-[#090d16] text-slate-100 min-h-screen antialiased">

  <header class="border-b border-slate-800 bg-[#0f172a]/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <a href="/" class="flex items-center space-x-2.5">
        <span class="h-8 w-8 rounded-lg bg-cyan-600 flex items-center justify-center font-bold text-white font-mono text-sm">GT</span>
        <span class="font-bold text-white tracking-tight">Grounded Threat News</span>
      </a>
      <a href="/" class="text-xs text-slate-400 hover:text-white">All incidents →</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
    <p id="status" class="text-slate-400 text-sm">Loading incident…</p>
    <article id="incident" class="hidden space-y-8"></article>
  </main>

  <script>
    // Builds an element; strings become text nodes, so source text is never parsed as HTML
    function el(tag, className, ...children) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      for (const child of children.flat()) {
        if (child === null || child === undefined || child === false) continue;
        node.append(child instanceof Node ? child : String(child));
      }
      return node;
    }

    function safeUrl(url) {
      try {
        const u = new URL(url);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
      } catch (e) {
        return null;
      }
    }

    function link(url, text) {
      const href = safeUrl(url);
      if (!href) return el('span', 'text-slate-400', text || url);
      const a = el('a', 'link', text || url);
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    }

    function badge(text, cls) {
      return el('span', `px-2 py-0.5 rounded text-[11px] font-semibold border ${cls}`, text);
    }

    function section(title, ...body) {
      return el('section', '', el('h2', 'section-title', title), ...body);
    }

    function namesCve(cve, text) {
      if (!cve || !text) return false;
      const escaped = cve.toUpperCase().replace(/[-]/g, '\\-');
      return new RegExp(`(^|[^0-9])${escaped}([^0-9]|$)`).test(text.toUpperCase().replace(/_/g, '-'));
    }

    // PoC links that are specific to this CVE; generic tool repos are left out
    function pocEntries(c) {
      const env = c.envelope || {};
      const details = {};
      for (const d of env.PoC_Details || []) if (d && d.url) details[d.url] = d;
      return (env.PoC_URLs || [])
        .filter(url => details[url] || namesCve(env.CVE_ID, url))
        .map(url => ({ url, ...(details[url] || {}) }));
    }

    function shortRepoName(url) {
      try {
        const u = new URL(url);
        return u.hostname === 'github.com' ? u.pathname.replace(/^\/|\/$/g, '') : u.hostname + u.pathname;
      } catch (e) {
        return url;
      }
    }

    function sourceLink(ref) {
      if (ref.is_working === false) {
        if (ref.archive_url) return el('span', '', link(ref.archive_url, ref.title || ref.url), el('span', 'text-slate-500 text-xs', ' (archived copy; original link is down)'));
        return el('span', '', link(ref.url, ref.title || ref.url), el('span', 'text-amber-400/80 text-xs', ' (link may be broken)'));
      }
      return link(ref.url, ref.title || ref.url);
    }

    function render(c) {
      const env = c.envelope || {};
      const d = c.in_depth || {};
      const ai = c.ai_assessment || {};
      const category = (c.pre_filter || {}).category;
      const cve = env.CVE_ID;
      const title = d.vulnerability_name || env.Title || 'Untitled advisory';
      const pocs = pocEntries(c);
      const article = document.getElementById('incident');

      document.title = `${cve || title} · Grounded Threat News`;

      // Header: tags, CVE, title, priority
      const tags = el('div', 'flex flex-wrap items-center gap-2',
        category === 'WEB' && badge('🌐 Web', 'bg-sky-950 text-sky-300 border-sky-800'),
        category === 'MOBILE' && badge('📱 Mobile', 'bg-emerald-950 text-emerald-300 border-emerald-800'),
        badge(c.recency_label || 'Monitored', 'bg-slate-900 text-slate-300 border-slate-700'),
        env.KEV_Status && badge('🔥 Actively exploited', 'bg-rose-950 text-rose-300 border-rose-800'),
        pocs.length > 0 && badge('🧪 Public PoC', 'bg-amber-950 text-amber-300 border-amber-800'),
      );
      const score = Number(c.priority_score || 0);
      article.append(el('div', 'space-y-3',
        tags,
        cve && el('p', 'font-mono text-cyan-400 font-bold', cve),
        el('h1', 'text-2xl sm:text-3xl font-bold text-white leading-tight', title),
        el('p', 'text-sm text-slate-400', 'Priority ', el('strong', 'text-white', `${score.toFixed(0)} / 100`), ' · ranked by active exploitation, severity and public PoCs'),
      ));

      if (c.updates_frozen && c.freeze_notice) {
        article.append(el('div', 'rounded-lg border border-amber-800/60 bg-amber-950/30 p-3 text-sm text-amber-200', '🔒 ', c.freeze_notice));
      }

      // What's the problem
      article.append(section("What's the problem",
        el('p', 'prose-text', d.full_description || env.Title || 'No description available.')));

      // Impact
      const impact = ai.offensive_impact || c.standard_category;
      article.append(section('Impact',
        impact && el('p', 'text-white font-semibold mb-1', impact),
        ai.reasoning && el('p', 'prose-text', ai.reasoning),
        !impact && !ai.reasoning && el('p', 'prose-text', 'Impact has not been assessed yet.')));

      // Affected product
      const versions = Array.isArray(env.Affected_Versions) ? env.Affected_Versions.join(', ') : env.Affected_Versions;
      if (env.Vendor_Product || versions) {
        article.append(section('Affected',
          env.Vendor_Product && el('p', 'text-slate-200', env.Vendor_Product),
          versions && el('p', 'text-sm text-slate-400 mt-1', 'Versions: ', versions)));
      }

      // Proof of concept
      const pocBody = pocs.length
        ? el('ul', 'space-y-3', pocs.map(p => el('li', 'rounded-lg border border-slate-800 bg-slate-900/50 p-3 space-y-1',
            el('div', 'font-mono text-sm', link(p.url, shortRepoName(p.url))),
            (p.author || p.stars) && el('p', 'text-xs text-slate-500',
              p.author ? `by ${p.author}` : '', p.author && p.stars ? ' · ' : '', p.stars ? `★ ${p.stars}` : ''),
            p.description && el('p', 'text-sm text-slate-300', p.description))))
        : el('p', 'prose-text', 'No public proof-of-concept found yet.');
      article.append(section('Proof of concept',
        pocs.length > 0 && el('p', 'text-xs text-slate-500 mb-2', 'Descriptions are written by each repository\'s author. Review code before running it.'),
        pocBody));

      // How to fix
      const bulletins = (d.vendor_bulletins || []).filter(safeUrl);
      article.append(section('How to fix',
        el('p', 'prose-text', d.required_action || 'No fix information in the source yet. Check the vendor links below for updates.'),
        bulletins.length > 0 && el('ul', 'mt-2 space-y-1 text-sm', bulletins.map(u => el('li', '', link(u))))));

      // Sources (PoC and fix links are already shown above)
      const shown = new Set([...pocs.map(p => p.url), ...bulletins]);
      const refs = (c.external_references || []).filter(r => r.url && !shown.has(r.url) && r.link_type !== 'Not CVE-Specific (Demo Placeholder)');
      if (refs.length) {
        article.append(section('Sources',
          el('ul', 'space-y-2 text-sm', refs.map(r => el('li', '',
            sourceLink(r),
            r.source_provider && el('span', 'block text-xs text-slate-500', r.source_provider))))));
      }

      article.append(el('footer', 'border-t border-slate-800 pt-4 text-xs text-slate-500 space-y-1',
        c.checked_label && el('p', '', c.checked_label),
        el('p', '', 'Generated automatically from public sources by GroundedCVE. Check the sources before acting on it.')));

      document.getElementById('status').classList.add('hidden');
      article.classList.remove('hidden');
    }

    async function load() {
      const status = document.getElementById('status');
      const itemId = decodeURIComponent(location.pathname.replace(/^\/incident\//, ''));
      try {
        const res = await fetch(`/api/newsletters/${encodeURIComponent(itemId)}`);
        if (!res.ok) {
          status.textContent = res.status === 404 ? 'This incident could not be found.' : 'Could not load this incident.';
          return;
        }
        render(await res.json());
      } catch (err) {
        status.textContent = 'Could not load this incident. Is the server running?';
      }
    }

    load();
  </script>
</body>
</html>
