# GroundedCVE: everything runs with one command.
#   cp .env.example .env      (fill in OPENROUTER_API_KEY, optionally Telegram)
#   docker compose up -d --build
# Dashboard: http://localhost:5000

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_HOST: qdrant
    OLLAMA_HOST: http://ollama:11434
  volumes:
    - ./Backend/data:/app/Backend/data

services:
  # Dashboard + REST API on http://localhost:5000
  app:
    <<: *app
    container_name: groundedcve-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      qdrant:
        condition: service_healthy

  # Runs the whole pipeline on start, then every PIPELINE_INTERVAL_HOURS (default 24):
  # ingest -> triage -> chunk -> index -> grounded summaries + gate -> weekly Telegram digest.
  # Follow it with: docker compose logs -f scheduler
  scheduler:
    <<: *app
    container_name: groundedcve-scheduler
    restart: unless-stopped
    command: ["python", "Backend/run_pipeline.py", "--loop"]
    healthcheck:
      disable: true   # the image's check pings the dashboard, which only the app container serves
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  qdrant:
    image: qdrant/qdrant:latest
    container_name: groundedcve-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web UI at http://localhost:6333/dashboard
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Embedding server. Not published to the host, so it never clashes with an
  # Ollama already running on the host's port 11434; the containers reach it as
  # http://ollama:11434.
  ollama:
    image: ollama/ollama:latest
    container_name: groundedcve-ollama
    restart: unless-stopped
    volumes:
      - ./ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-off: downloads nomic-embed-text into ./ollama_data (skipped quickly once it is there).
  ollama-pull:
    image: ollama/ollama:latest
    container_name: groundedcve-ollama-pull
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
